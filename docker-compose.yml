services:
  task-hub:
    build: .
    container_name: mcp-task-hub
    ports:
      - "${HUB_PORT:-8000}:8000"
    volumes:
      - hub-data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub-data:
    driver: local
