services:
  task-hub:
    build: .
    container_name: task-hub
    user: "1000:1000"
    ports:
      - "127.0.0.1:8050:8000"
    volumes:
      - ./data:/data
      # read-only: lets the UI open the OpenSpec file a task's specRef names
      # (project == directory name under this root)
      - ${HUB_REPOS_HOST_DIR:-/home/mdv/code}:/repos:ro
    environment:
      - HOME=/tmp
      - HUB_REPOS_DIR=/repos
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
